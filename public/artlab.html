<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ironclad Art Lab</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #15181b; color: #cfd6dc; font: 13px/1.3 system-ui, sans-serif; }
    header { position: sticky; top: 0; z-index: 2; background: #1d2125; padding: 8px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid #2c3238; }
    header h1 { font-size: 16px; margin: 0 12px 0 0; }
    header a { color: #7fd8ff; }
    button, select { background: #2b3238; color: #e6ecf0; border: 1px solid #3f4850; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
    section { padding: 12px 16px; }
    h2 { font-size: 14px; color: #8fa0ad; text-transform: uppercase; letter-spacing: .08em; margin: 8px 0; }
    #field { width: min(100%, 560px); aspect-ratio: 24 / 32; display: block; background: #0e1012; border-radius: 6px; }
    #status { color: #8fa0ad; margin: 6px 0; font-variant-numeric: tabular-nums; }
    table { border-collapse: collapse; }
    th { font-weight: 600; font-size: 11px; color: #9fb0bc; padding: 4px; }
    th.rowh { text-align: right; white-space: nowrap; }
    td { border: 1px solid #262b30; padding: 2px; background: #1b1f23; }
    td.na { background: repeating-linear-gradient(45deg, #17191c, #17191c 6px, #1b1e21 6px, #1b1e21 12px); }
    .cell, .icon { display: inline-flex; flex-direction: column; align-items: center; margin: 3px; vertical-align: top; }
    #modules .cell { width: 118px; background: #1b1f23; border-radius: 6px; padding: 4px 0; }
    .icon { width: 96px; background: #1b1f23; border-radius: 6px; padding: 4px 0; }
    .lab { font-size: 11px; text-align: center; color: #dfe6ea; max-width: 110px; }
    .sub { font-size: 10px; color: #7d8b96; text-align: center; max-width: 110px; }
    #small { background: #24282b; padding: 8px; border-radius: 6px; }
  </style>
</head>
<body>
  <header>
    <h1>Ironclad Art Lab</h1>
    <button id="demo">Demo battle</button>
    <button id="reset">Board</button>
    <label>Speed <select id="speed"><option>0.5</option><option selected>1</option><option>2</option><option>4</option></select></label>
    <a href="?enemy=1">enemy colours</a> <a href="?">friendly</a>
  </header>
  <section id="sec-field"><h2>Field</h2><canvas id="field"></canvas><div id="status"></div></section>
  <section id="sec-small"><h2>Readability at ~20px per cell</h2><div id="small"></div></section>
  <section id="sec-grid"><h2>Chassis x mobility</h2><div id="grid"></div></section>
  <section id="sec-modules"><h2>Every module on a reference chassis</h2><div id="modules"></div></section>
  <section id="sec-icons"><h2>Part icons (drawPartIcon)</h2><div id="icons"></div></section>
  <script type="module" src="artlab.js"></script>
</body>
</html>
